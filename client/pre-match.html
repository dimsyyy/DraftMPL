    <script src="/socket.io/socket.io.js"></script>

    <script>
      function fitTeamNames() {
        document.querySelectorAll(".team-name").forEach((container) => {
          const textEl = container.firstElementChild; // .team-left atau .team-right
          if (!textEl) return;

          // reset font ke maksimal dulu
          let maxFont = 128;
          let minFont = 10;
          textEl.style.fontSize = maxFont + "px";

          // kecilkan sampai muat
          while (
            textEl.scrollWidth > container.clientWidth &&
            maxFont > minFont
          ) {
            maxFont -= 1;
            textEl.style.fontSize = maxFont + "px";
          }
        });
      }

      // jalankan saat halaman load
      window.addEventListener("load", fitTeamNames);
      // jalankan ulang kalau ukuran layar berubah
      window.addEventListener("resize", fitTeamNames);
    </script>
