<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MVP OVERLAY</title>
    <link rel="stylesheet" href="assets/css/mvp.css" />
  </head>
  <body>
    <div class="mvp-container">
      <div class="header">
        <div class="left-header">
          <div class="logo"><img src="assets/images/ItFest.png" alt="" /></div>
          <div class="pogame">PLAYER OF THE GAME</div>
        </div>
        <div class="title">QUARTER FINALS</div>
      </div>
      <div class="middle-content">
        <div class="hero-container">
          <img src="assets/images/heroState/webp/aldous.webp" alt="" />
        </div>
        <div class="spellItem">
          <div class="title">SPELL</div>
          <div class="spell-img">
            <img src="assets/images/BattleSpell/Aegis.png" alt="" />
          </div>
          <div class="title">ITEM</div>
          <div class="item-img">
            <div class="item">
              <img src="assets/images/BattleSpell/Aegis.png" alt="" />
            </div>
            <div class="item">
              <img src="assets/images/BattleSpell/Aegis.png" alt="" />
            </div>
            <div class="item">
              <img src="assets/images/BattleSpell/Aegis.png" alt="" />
            </div>
            <div class="item">
              <img src="assets/images/BattleSpell/Aegis.png" alt="" />
            </div>
            <div class="item">
              <img src="assets/images/BattleSpell/Aegis.png" alt="" />
            </div>
            <div class="item">
              <img src="assets/images/BattleSpell/Aegis.png" alt="" />
            </div>
          </div>
        </div>
        <div class="kda">
          <div class="kda-container">
            <div class="miniTitle">K/D/A</div>
            <div class="kda-value">7 / 2 / 7</div>
          </div>
          <div class="line"></div>
          <div class="dmg-container">
            <div class="miniTitle">DAMAGE</div>
            <div class="damageValue">874732</div>
          </div>
          <div class="line"></div>
          <div class="gold-container">
            <div class="miniTitle">GOLD</div>
            <div class="goldValue">20.3k</div>
          </div>
        </div>
      </div>
      <div class="bottom-content">
        <div class="mvp-title">MVP</div>
        <div class="line"></div>
        <div class="bgmol">
          <img src="assets/images/bgmol.png" alt="" />
        </div>
      </div>
      <div class="player-info">
        <div class="player-img">
          <img src="assets/images/Roster/dyren.png" alt="" />
        </div>
        <div class="player-info-detail">
          <div class="role">
            <img src="assets/images/roles/exp.png" alt="" />
          </div>
          <div class="player-name">SUTSUJIN</div>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="assets/js/mvp.js"></script>
  </body>
</html>
